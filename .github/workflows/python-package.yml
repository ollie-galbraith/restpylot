# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - .github/workflows/python-package.yml
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest requests toml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install module dependencies
        run: |
          DEPENDENCIES=$(python .github/workflows/get_dependencies.py)
          if [ -n "$DEPENDENCIES" ]; then
            echo "Installing dependencies: $DEPENDENCIES"
            python -m pip install $DEPENDENCIES
          else
            echo "No dependencies found."
          fi

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 ./src --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 ./src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          pytest

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry toml

      - name: Get current version
        id: get_version
        run: |
          CURRENT_VERSION=$(python .github/workflows/get_version.py)
          CURRENT_VERSION=${CURRENT_VERSION#v}
          echo "CURRENT_VERSION=$CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get previous version
        id: get_previous_version
        run: |
          PREVIOUS_VERSION="0"
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git show HEAD~1:pyproject.toml > /tmp/previous-pyproject.toml 2>/dev/null || true
            if [ -f /tmp/previous-pyproject.toml ]; then
              PREVIOUS_VERSION=$(python .github/workflows/get_version.py /tmp/previous-pyproject.toml)
            fi
          fi
          echo "PREVIOUS_VERSION=$PREVIOUS_VERSION"
          echo "previous_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check version increment
        if: steps.get_version.outputs.version != steps.get_previous_version.outputs.previous_version
        run: echo "Version has been incremented. Proceeding with publish."

      - name: Build package
        if: steps.get_version.outputs.version != steps.get_previous_version.outputs.previous_version
        run: |
          poetry build

      - name: Publish package
        if: steps.get_version.outputs.version != steps.get_previous_version.outputs.previous_version
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          poetry publish --username __token__ --password $POETRY_PYPI_TOKEN_PYPI
